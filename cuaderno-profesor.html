function resizeImageFile(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('No se pudo leer el archivo'));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('No se pudo cargar la imagen'));
      img.onload = () => {
        const size = 160;
        const canvas = document.createElement('canvas');
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext('2d');
        const scale = Math.max(size / img.width, size / img.height);
        const w = img.width * scale;
        const h = img.height * scale;
        ctx.drawImage(img, (size - w) / 2, (size - h) / 2, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.75));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function initialData() {
  const esoGroups = [
    { id: 's1a', name: '1º ESO A', nivel: 'ESO', curso: '1º ESO', students: ESO_GROUPS_DATA.s1a },
    { id: 's1b', name: '1º ESO B', nivel: 'ESO', curso: '1º ESO', students: ESO_GROUPS_DATA.s1b },
    { id: 's1c', name: '1º ESO C', nivel: 'ESO', curso: '1º ESO', students: ESO_GROUPS_DATA.s1c },
    { id: 's3c', name: '3º ESO C', nivel: 'ESO', curso: '3º ESO', students: ESO_GROUPS_DATA.s3c },
    { id: 's3d', name: '3º ESO D', nivel: 'ESO', curso: '3º ESO', students: ESO_GROUPS_DATA.s3d },
    { id: 's3e', name: '3º ESO E', nivel: 'ESO', curso: '3º ESO', students: ESO_GROUPS_DATA.s3e },
    { id: 's3f', name: '3º ESO F', nivel: 'ESO', curso: '3º ESO', students: ESO_GROUPS_DATA.s3f },
  ];

  const bachGroups = [
    { id: 'b1a', name: '1º Bachillerato A', nivel: 'BACH', curso: '1º Bach', students: B1A_DITI_STUDENTS },
  ];

  const groups = [...esoGroups, ...bachGroups];

  const assignments = {};
  const grades = {};
  esoGroups.forEach((g) => {
    const a1 = uid();
    assignments[g.id] = [
      { id: a1, name: 'Trabajo 1' },
    ];
    grades[g.id] = {};
    g.students.forEach((s) => {
      grades[g.id][s.id] = {};
    });
  });

  const bachAssessments = {};
  const bachGrades = {};
  bachGroups.forEach((g) => {
    const e1 = uid(), l1 = uid();
    bachAssessments[g.id] = {
      1: [
        { id: e1, name: 'Examen 1', type: 'examen' },
        { id: l1, name: 'Lámina 1', type: 'lamina' },
      ],
      2: [],
      3: [],
    };
    bachGrades[g.id] = { 1: {}, 2: {}, 3: {} };
    g.students.forEach((s) => {
      bachGrades[g.id][1][s.id] = {};
    });
  });

  const paidLaminas = {};
  const banoPermiso = {};
  groups.forEach((g) => {
    paidLaminas[g.id] = {};
    banoPermiso[g.id] = {};
  });

  return { groups, assignments, grades, bachAssessments, bachGrades, paidLaminas, banoPermiso };
}

function average(values) {
  const nums = values.map((v) => parseFloat(v)).filter((v) => !isNaN(v));
  if (nums.length === 0) return null;
  return nums.reduce((a, b) => a + b, 0) / nums.length;
}

function initials(name) {
  const parts = name.split(',');
  const first = (parts[1] || '').trim().charAt(0);
  const last = (parts[0] || '').trim().charAt(0);
  return (first + last).toUpperCase() || '?';
}

function CuadernoProfesor() {
  const [data, setData] = useState(initialData);
  const [photos, setPhotos] = useState(() => ({ ...B1A_DITI_PHOTOS, ...ESO_PHOTOS }));
  const [activeGroupId, setActiveGroupId] = useState('s1a');
  const [activeTrim, setActiveTrim] = useState(1);
  const [loaded, setLoaded] = useState(false);
  const [saveState, setSaveState] = useState('idle');
  const [photoError, setPhotoError] = useState('');
  const saveTimer = useRef(null);
  const photoSaveTimer = useRef(null);
  const fileInputRef = useRef(null);
  const pendingStudentId = useRef(null);

  useEffect(() => {
    (async () => {
      try {
        const res = await window.storage.get(STORAGE_KEY, false);
        if (res && res.value) {
          setData(JSON.parse(res.value));
        }
      } catch (e) {
        // no hay datos guardados todavía
      }
      try {
        const resPhotos = await window.storage.get(PHOTOS_KEY, false);
        if (resPhotos && resPhotos.value) {
          setPhotos(JSON.parse(resPhotos.value));
        }
      } catch (e) {
        // no hay fotos guardadas todavía
      }
      setLoaded(true);
    })();
  }, []);

  const persist = useCallback((next) => {
    setSaveState('saving');
    if (saveTimer.current) clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(async () => {
      try {
        await window.storage.set(STORAGE_KEY, JSON.stringify(next), false);
        setSaveState('saved');
      } catch (e) {
        setSaveState('error');
      }
    }, 500);
  }, []);

  useEffect(() => {
    if (!loaded) return;
    persist(data);
  }, [data, loaded, persist]);

  const persistPhotos = useCallback((next) => {
    if (photoSaveTimer.current) clearTimeout(photoSaveTimer.current);
    photoSaveTimer.current = setTimeout(async () => {
      try {
        await window.storage.set(PHOTOS_KEY, JSON.stringify(next), false);
      } catch (e) {
        setPhotoError('No se pudieron guardar las fotos (puede que ocupen demasiado espacio).');
      }
    }, 400);
  }, []);

  useEffect(() => {
    if (!loaded) return;
    persistPhotos(photos);
  }, [photos, loaded, persistPhotos]);

  function requestPhotoUpload(studentId) {
    pendingStudentId.current = studentId;
    if (fileInputRef.current) fileInputRef.current.click();
  }

  async function handlePhotoChosen(e) {
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    const studentId = pendingStudentId.current;
    if (!file || !studentId) return;
    if (!file.type.startsWith('image/')) {
      setPhotoError('Elige un archivo de imagen.');
      return;
    }
    try {
      const dataUrl = await resizeImageFile(file);
      setPhotoError('');
      setPhotos((prev) => ({ ...prev, [studentId]: dataUrl }));
    } catch (err) {
      setPhotoError('No se pudo procesar la foto.');
    }
  }

  function removePhoto(studentId) {
    setPhotos((prev) => {
      const next = { ...prev };
      delete next[studentId];
      return next;
    });
  }

  const group = data.groups.find((g) => g.id === activeGroupId);
  const isBach = group && group.nivel === 'BACH';

  const esoGroupList = data.groups.filter((g) => g.nivel === 'ESO');
  const bachGroupList = data.groups.filter((g) => g.nivel === 'BACH');
  const cursos = [...new Set(esoGroupList.map((g) => g.curso))];

  function updateGrade(groupId, studentId, assignmentId, value) {
    setData((prev) => ({
      ...prev,
      grades: {
        ...prev.grades,
        [groupId]: {
          ...prev.grades[groupId],
          [studentId]: { ...prev.grades[groupId][studentId], [assignmentId]: value },
        },
      },
    }));
  }

  function updateBachGrade(groupId, trim, studentId, assessmentId, value) {
    setData((prev) => ({
      ...prev,
      bachGrades: {
        ...prev.bachGrades,
        [groupId]: {
          ...prev.bachGrades[groupId],
          [trim]: {
            ...prev.bachGrades[groupId][trim],
            [studentId]: { ...(prev.bachGrades[groupId][trim][studentId] || {}), [assessmentId]: value },
          },
        },
      },
    }));
  }

  function togglePaidLaminas(groupId, studentId) {
    setData((prev) => ({
      ...prev,
      paidLaminas: {
        ...prev.paidLaminas,
        [groupId]: {
          ...(prev.paidLaminas[groupId] || {}),
          [studentId]: !(prev.paidLaminas[groupId] || {})[studentId],
        },
      },
    }));
  }

  function toggleBano(groupId, studentId) {
    setData((prev) => ({
      ...prev,
      banoPermiso: {
        ...prev.banoPermiso,
        [groupId]: {
          ...(prev.banoPermiso[groupId] || {}),
          [studentId]: !(prev.banoPermiso[groupId] || {})[studentId],
        },
      },
    }));
  }

  function addAssignment(groupId) {
    const id = uid();
    setData((prev) => {
      const nextAssignments = {
        ...prev.assignments,
        [groupId]: [...prev.assignments[groupId], { id, name: `Trabajo ${prev.assignments[groupId].length + 1}` }],
      };
      return { ...prev, assignments: nextAssignments };
    });
  }

  function renameAssignment(groupId, assignmentId, name) {
    setData((prev) => ({
      ...prev,
      assignments: {
        ...prev.assignments,
        [groupId]: prev.assignments[groupId].map((a) => (a.id === assignmentId ? { ...a, name } : a)),
      },
    }));
  }

  function removeAssignment(groupId, assignmentId) {
    setData((prev) => ({
      ...prev,
      assignments: {
        ...prev.assignments,
        [groupId]: prev.assignments[groupId].filter((a) => a.id !== assignmentId),
      },
    }));
  }

  function addBachItem(groupId, trim, type) {
    const id = uid();
    const label = type === 'examen' ? 'Examen' : 'Lámina';
    setData((prev) => {
      const list = prev.bachAssessments[groupId][trim];
      const count = list.filter((i) => i.type === type).length + 1;
      return {
        ...prev,
        bachAssessments: {
          ...prev.bachAssessments,
          [groupId]: {
            ...prev.bachAssessments[groupId],
            [trim]: [...list, { id, name: `${label} ${count}`, type }],
          },
        },
      };
    });
  }

  function renameBachItem(groupId, trim, itemId, name) {
    setData((prev) => ({
      ...prev,
      bachAssessments: {
        ...prev.bachAssessments,
        [groupId]: {
          ...prev.bachAssessments[groupId],
          [trim]: prev.bachAssessments[groupId][trim].map((i) => (i.id === itemId ? { ...i, name } : i)),
        },
      },
    }));
  }

  function removeBachItem(groupId, trim, itemId) {
    setData((prev) => ({
      ...prev,
      bachAssessments: {
        ...prev.bachAssessments,
        [groupId]: {
          ...prev.bachAssessments[groupId],
          [trim]: prev.bachAssessments[groupId][trim].filter((i) => i.id !== itemId),
        },
      },
    }));
  }

  if (!group) return null;

  const assignments = data.assignments[group.id] || [];
  const bachItems = isBach ? (data.bachAssessments[group.id]?.[activeTrim] || []) : [];
  const examItems = bachItems.filter((i) => i.type === 'examen');
  const laminaItems = bachItems.filter((i) => i.type === 'lamina');

  return (
    <div style={styles.app}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Big+Shoulders:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap');
        * { box-sizing: border-box; }
        .cp-scroll::-webkit-scrollbar { height: 8px; width: 8px; }
        .cp-scroll::-webkit-scrollbar-thumb { background: #3E6E96; border-radius: 4px; }
        input[type="text"].cp-input, input[type="number"].cp-input {
          font-family: 'IBM Plex Sans', sans-serif;
        }
        .cp-cell:focus { outline: 2px solid #C9A227; outline-offset: -1px; }
      `}</style>

      <header style={styles.header}>
        <div style={styles.headerLeft}>
          <Ruler size={22} color="#F3EFE4" strokeWidth={1.75} />
          <div>
            <div style={styles.title}>Cuaderno de profesor</div>
            <div style={styles.subtitle}>I.E.S. &quot;Pérez de Ayala&quot; · Dpto. Artes Plásticas</div>
          </div>
        </div>
        <div style={styles.saveIndicator}>
          <Save size={14} color={saveState === 'saved' ? '#9CC49B' : '#C9A227'} />
          <span>{saveState === 'saving' ? 'Guardando…' : saveState === 'error' ? 'Sin conexión de guardado' : 'Guardado'}</span>
        </div>
      </header>

      <input
        ref={fileInputRef}
        type="file"
        accept="image/*"
        onChange={handlePhotoChosen}
        style={{ display: 'none' }}
      />
      {photoError && <div style={styles.photoError}>{photoError}</div>}

      <div style={styles.body}>
        <nav style={styles.sidebar} className="cp-scroll">
          {cursos.map((curso) => (
            <div key={curso} style={styles.navSection}>
              <div style={styles.navSectionLabel}>{curso}</div>
              {esoGroupList.filter((g) => g.curso === curso).map((g) => (
                <button
                  key={g.id}
                  onClick={() => setActiveGroupId(g.id)}
                  style={{ ...styles.navItem, ...(g.id === activeGroupId ? styles.navItemActive : {}) }}
                >
                  {g.name}
                </button>
              ))}
            </div>
          ))}
          <div style={styles.navSection}>
            <div style={styles.navSectionLabel}>Bachillerato</div>
            {bachGroupList.map((g) => (
              <button
                key={g.id}
                onClick={() => setActiveGroupId(g.id)}
                style={{ ...styles.navItem, ...(g.id === activeGroupId ? styles.navItemActive : {}) }}
              >
                {g.name}
              </button>
            ))}
          </div>
        </nav>

                    <Trash2 size={13} color="#B8433C" />
                  </button>
                </div>

                  <Plus size={12} /> Examen
                </button>
                <button style={styles.addBtnSm} onClick={() => onAdd(group.id, trim, 'lamina')}>
                  <Plus size={12} /> Lámina
                </button>
              </div>
            </th>
            <th style={{ ...styles.th, minWidth: 90 }}>Nota</th>
          </tr>
        </thead>
        <tbody>
          {group.students.map((s, idx) => {
            const studentGrades = grades[s.id] || {};
            const examAvg = average(examItems.map((it) => studentGrades[it.id]));
            const laminaAvg = average(laminaItems.map((it) => studentGrades[it.id]));
            let final = null;
            if (examAvg !== null) {
              final = examAvg * 0.8 + (laminaAvg !== null ? laminaAvg * 0.2 : 0);
            }
            return (
              <tr key={s.id} style={idx % 2 === 0 ? styles.rowEven : styles.rowOdd}>

                      student={s}
                      photoUrl={photos[s.id]}
                      onClick={() => onPhotoClick(s.id)}
                      onRemove={() => onPhotoRemove(s.id)}
                    />
                    <span>{s.name}</span>
                  </div>
                </td>
                {trim === 1 && (
                  <td style={styles.td}>
                    <input
                      type="checkbox"
                      checked={!!paid[s.id]}
                      onChange={() => onTogglePaid(s.id)}
                      style={styles.checkbox}
                    />
                  </td>
                )}
                {trim === 1 && (
                  <td style={styles.td}>
                    <input
                      type="checkbox"
                      checked={!!bano[s.id]}
                      onChange={() => onToggleBano(s.id)}
                      style={styles.checkbox}
                    />
                  </td>
                )}
                {items.map((it) => (
                  <td key={it.id} style={styles.td}>
                    <input
                      className="cp-input cp-cell"
                      type="number"
                      min="0"
                      max="10"
                      step="0.1"
                      value={studentGrades[it.id] ?? ''}
                      onChange={(e) => onUpdate(group.id, trim, s.id, it.id, e.target.value)}
                      style={styles.gradeInput}
                    />
                  </td>
                ))}
                <td style={styles.td}></td>
                <td style={styles.td}>
                  {final === null ? (
                    <span style={styles.mediaEmpty}>—</span>
                  ) : (
                    <span style={{ ...styles.mediaBadge, ...(final >= 4.5 ? styles.mediaPass : styles.mediaFail) }}>
                      {final.toFixed(2)}
                    </span>
                  )}
                </td>
              </tr>
            );
          })}
        </tbody>
      </table>
    </div>
  );
}

  const [hover, setHover] = useState(false);
  return (
    <div
      style={styles.avatarWrap}
      onMouseEnter={() => setHover(true)}
      onMouseLeave={() => setHover(false)}
    >
      <button
        type="button"
        onClick={onClick}
        title={photoUrl ? 'Cambiar foto' : 'Subir foto'}
        style={{ ...styles.avatarBtn, ...(photoUrl ? {} : styles.avatar) }}
      >
        {photoUrl ? (
          <img src={photoUrl} alt="" style={styles.avatarImg} />
        ) : (
          initials(student.name)
        )}
      </button>
      {photoUrl && hover && (
        <button
          type="button"
          onClick={onRemove}
          aria-label="Quitar foto"
          style={styles.avatarRemove}
        >
          <Trash2 size={13} color="#F7C1C1" />
        </button>
      )}
    </div>
  );
}

function waitForFirebase() {
  return new Promise((resolve) => {
    if (window.storage) return resolve();
    window.addEventListener('firebase-ready', () => resolve(), { once: true });
    setTimeout(resolve, 2000);
  });
}

waitForFirebase().then(() => {
  try {
    if (!window.storage) {
      window.storage = {
        async get() { return null; },
        async set(key, value) { return { key, value, shared: false }; },
        async delete() { return null; },
        async list() { return { keys: [] }; },
      };
    }
    const __src = document.getElementById('app-source').textContent;
    const __out = Babel.transform(__src, {
      presets: [['react', { runtime: 'classic' }]],
      filename: 'app.jsx',
    }).code;
    const __script = document.createElement('script');
    __script.textContent = __out;
    document.body.appendChild(__script);

    const rootEl = document.getElementById('root');
    const root = ReactDOM.createRoot(rootEl);
    root.render(React.createElement(CuadernoProfesor));
  } catch (e) {
    console.error('Error al arrancar la app', e);
    document.getElementById('root').innerHTML =
      '<div style="color:#F7C1C1;font-family:sans-serif;padding:24px;white-space:pre-wrap;">' +
      'Error al cargar la app:\\n\\n' + (e && e.message ? e.message : String(e)) +
      (e && e.stack ? '\\n\\n' + e.stack : '') +
      '</div>';
  }
});
